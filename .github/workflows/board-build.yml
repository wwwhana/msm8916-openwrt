name: Board Build

# Builds only the boards a pull request actually touches, so "it builds on my
# machine" stops being the only evidence.  Opt-in per pull request with the
# `board-build` label: one board is ~40 minutes, and most pull requests do not
# need it.  Nothing is published and no secret is used - a pull request from a
# fork gets a throwaway signing key and the artifact is discarded. Manual
# dispatches retain experimental images for inspection, without a release.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'diffconfigs/**'
      - 'msm89xx/**'
      - 'packages/**'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      device:
        description: 'Board to build (empty = every diffconfigs/ entry)'
        required: false
        default: ''
        type: string
      bootloader_only:
        description: 'Build only the bootloader ZIP and installer (requires a device)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: board-build-${{ github.event.pull_request.number || github.ref_name }}-${{ inputs.bootloader_only && 'bootloader' || 'full' }}
  cancel-in-progress: true

jobs:
  pick:
    name: Pick boards
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'board-build')
    outputs:
      devices: ${{ steps.pick.outputs.devices }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which boards this pull request touches
        id: pick
        env:
          DEVICE: ${{ inputs.device }}
          BASE: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
          BOOTLOADER_ONLY: ${{ inputs.bootloader_only }}
        run: |
          set -euo pipefail
          if [ "$BOOTLOADER_ONLY" = "true" ] && [ -z "$DEVICE" ]; then
            echo '::error::Bootloader-only builds require an explicit device'
            exit 1
          fi
          if [ -n "$DEVICE" ]; then
            [[ "$DEVICE" =~ ^[a-z0-9_-]+$ ]] && [ -f "diffconfigs/$DEVICE" ] || {
              echo '::error::Unknown device'
              exit 1
            }
            LIST="\"$DEVICE\""
            REASON="dispatch: $DEVICE"
          elif [ "$EVENT" = "pull_request" ]; then
            git fetch -q --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
            changed=$(git diff --name-only "origin/$BASE...HEAD" -- diffconfigs |
                      sed 's|diffconfigs/||' | sort -u)
            if [ -n "$changed" ]; then
              LIST=$(printf '%s\n' "$changed" | sed 's/.*/"&"/' | paste -sd, -)
              REASON="diffconfigs touched: $(printf '%s' "$changed" | tr '\n' ' ')"
            else
              # A patch or package change usually targets one board, but we
              # cannot tell which: build one known-good board to prove the tree
              # still compiles, and say so.
              LIST='"hmuf02v5"'
              REASON="no diffconfigs change - sentinel build of hmuf02v5"
            fi
          else
            LIST=$(ls diffconfigs | sed 's/.*/"&"/' | paste -sd, -)
            REASON="every diffconfigs/ entry"
          fi
          echo "devices=[$LIST]" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "::notice::Boards [$LIST] - $REASON"

  build:
    name: Build ${{ matrix.device }}
    needs: pick
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.pick.outputs.devices) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo apt-get clean

      - name: Cache OpenWrt downloads & toolchain
        if: ${{ !inputs.bootloader_only }}
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
            openwrt/staging_dir/host
          key: openwrt-pr-cache-${{ hashFiles('version', 'diffconfigs/hmuf02v5') }}
          restore-keys: |
            openwrt-pr-cache-

      - name: Prepare OpenWrt tree
        if: ${{ !inputs.bootloader_only }}
        run: ./build.sh prepare

      - name: Build ${{ matrix.device }}
        if: ${{ !inputs.bootloader_only }}
        run: ./build.sh build "${{ matrix.device }}"

      - name: Build bootloader bundle only
        if: inputs.bootloader_only
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          ./build.sh image
          export HOST_UID="$(id -u)" HOST_GID="$(id -g)"
          docker compose -f devenv/docker-compose.yml run --rm -T --no-deps \
            -w /repo -e DEVICE builder bash -euc '
              profile=$(sed -n "s/^CONFIG_TARGET_msm89xx_msm8916_DEVICE_\(.*\)=y$/\1/p" "diffconfigs/$DEVICE")
              [[ "$profile" =~ ^[a-z0-9_-]+$ ]] || exit 1
              export TOPDIR=/repo/openwrt AARCH64_CROSS=aarch64-linux-gnu-
              export AARCH64_CC="${AARCH64_CROSS}gcc" AARCH64_AS="${AARCH64_CROSS}as"
              export AARCH64_LD="${AARCH64_CROSS}ld" AARCH64_AR="${AARCH64_CROSS}ar"
              export AARCH64_OBJCOPY="${AARCH64_CROSS}objcopy"
              out="$TOPDIR/bin/targets/msm89xx/msm8916"
              prefix="msm8916-openwrt-msm89xx-msm8916-$profile"
              mkdir -p "$out"
              ./msm89xx/image/generate_firmware.sh "$out/$prefix-firmware.zip"
              install -m 755 ./msm89xx/image/flash.sh "$out/$prefix-flash.sh"
            '

      - name: Check manual build outputs
        if: github.event_name == 'workflow_dispatch'
        env:
          BOOTLOADER_ONLY: ${{ inputs.bootloader_only }}
        run: |
          set -euo pipefail
          out=openwrt/bin/targets/msm89xx/msm8916
          suffixes=(flash.sh firmware.zip)
          if [ "$BOOTLOADER_ONLY" != "true" ]; then
            suffixes+=(squashfs-gpt_both0.bin squashfs-boot.img squashfs-system.img squashfs-sysupgrade.bin)
          fi
          for suffix in "${suffixes[@]}"; do
            compgen -G "$out/*-$suffix" >/dev/null || {
              echo "::error::Required output missing: $suffix"
              exit 1
            }
          done

      - name: Upload manual test build
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ matrix.device }}${{ inputs.bootloader_only && '-bootloader' || '' }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            openwrt/bin/targets/msm89xx/msm8916/*-squashfs-gpt_both0.bin
            openwrt/bin/targets/msm89xx/msm8916/*-squashfs-boot.img
            openwrt/bin/targets/msm89xx/msm8916/*-squashfs-system.img
            openwrt/bin/targets/msm89xx/msm8916/*-squashfs-sysupgrade.bin
            openwrt/bin/targets/msm89xx/msm8916/*-flash.sh
            openwrt/bin/targets/msm89xx/msm8916/*-firmware.zip
            openwrt/bin/targets/msm89xx/msm8916/*.manifest

      - name: Report
        if: always()
        run: |
          echo "Board ${{ matrix.device }}: ${{ job.status }} (${{ needs.pick.outputs.reason }})"
